name: Fetch Monster prices

on:
  schedule:
    # Every 3 hours. Matches the cadence the Israeli price-transparency law
    # itself requires chains to publish at — polling faster buys nothing.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write # the job commits data/ back to the repo

# Only one scrape at a time. Observed 2026-09-13, right after the chain
# list went from 6 to 21: a scheduled run started while the previous one
# was still going, so two jobs were scraping and both were heading for the
# same `git push` on main. The push step already rebases and retries, but
# that is recovery from a collision rather than avoiding one, and the
# collision gets likelier as the run gets longer.
#
# cancel-in-progress is false on purpose: killing a run halfway through
# throws away everything it has scraped and leaves the promo cache
# half-written. A queued run simply waits, and GitHub keeps only the
# newest pending one, which is exactly the wanted behaviour — a backed-up
# schedule should skip to current, not replay every missed slot.
concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # A scrape that has not finished in two and a half hours is stuck, not
    # slow — without this the default is six hours of a wedged runner.
    #
    # Was 120, which the run outgrew: the scrape alone is ~65 minutes and
    # roughly 13 GB of XML. The promo phase is capped at 25 now
    # (PROMO_PHASE_BUDGET_SECONDS) so the total is bounded at about 95,
    # and the extra 30 here is margin for the one run a day that refreshes
    # the archive. Margin matters more than it looks: a run that overruns
    # commits nothing, which leaves the next run's caches cold, which
    # makes it slower still.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        working-directory: israel-poc
        run: pip install -r requirements.txt

      # Eight chains come from the public price archive instead of being
      # scraped (israel-poc/archive.py). Their source files total 1.08 GB —
      # Super Pharm alone is 604 MB — and re-downloading the set every three
      # hours is what pushed this job from 1:04 to the 120-minute timeout on
      # 2026-09-30. The pipeline keeps the parsed result in a cache file and
      # only refetches chains the archive has actually republished, but a CI
      # runner is thrown away at the end of the job, so without this step
      # that cache is empty on arrival every single time and the saving
      # never happens.
      #
      # The key is per-run on purpose, so the exact key always misses and
      # the save step always writes the updated file back; restore-keys
      # then loads the most recent previous one. Keying on content instead
      # would refuse to save the very update this exists to keep.
      #
      # Restore and save are separate actions rather than one cache step
      # because the combined one saves in a post-job hook that is skipped
      # when the job fails. Four runs in a row overran the timeout, so the
      # save never ran, so every run started cold and re-downloaded 365 MB
      # it already had — the cache could not warm up until something
      # finished, and nothing could finish until the cache was warm.
      #
      # A miss is not a failure. The run downloads, exactly as it did before
      # there was a cache, and warms the next one.
      - name: Restore the parsed price archive
        uses: actions/cache/restore@v4
        with:
          path: israel-poc/.archive-cache.json
          key: price-archive-${{ github.run_id }}
          restore-keys: price-archive-

      - name: Run the pipeline
        working-directory: israel-poc
        env:
          # Optional. Powers data/promotions.json — see promotions.py.
          # Leave the repo secret unset and this step still runs fine,
          # just without promo data. Set it in Settings -> Secrets and
          # variables -> Actions once you have a token from
          # openisraelisupermarkets.co.il.
          OPEN_IL_SUPERMARKETS_TOKEN: ${{ secrets.OPEN_IL_SUPERMARKETS_TOKEN }}
        run: python pipeline.py

      # if: always() is the point of the split — see above.
      - name: Save the parsed price archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: israel-poc/.archive-cache.json
          key: price-archive-${{ github.run_id }}

      - name: Commit updated data
        run: |
          git config user.name "energy-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "No data changes this run."; exit 0; }
          git commit -m "Update price data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # main can move (app-code commits, another run) in the ~50 minutes
          # this job takes to scrape nationwide, so a bare `git push` here
          # was a real, confirmed failure mode.
          #
          # `git pull --rebase` was the first fix and it is NOT enough: these
          # files are machine-generated JSON, so a three-way merge produces
          # conflict markers rather than a result. Confirmed 2026-09-14 -- a
          # hand commit touching town-coords.json collided with a running
          # scrape, the rebase conflicted, and because the loop never cleared
          # the half-finished rebase every later attempt failed against it.
          # A 50-minute nationwide scrape was lost over a cache file where
          # both sides said the same thing.
          #
          # So: keep this run's output aside, reset hard onto origin/main,
          # and let merge_data.py reconcile per file (snapshots ours, history
          # and caches unioned). That cannot conflict, because nothing is
          # merged textually.
          OURS="$(mktemp -d)"
          cp -r data/. "$OURS/"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt/5), reconciling with origin/main..."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python israel-poc/merge_data.py "$OURS"
            git add data/
            git diff --cached --quiet && { echo "nothing left to commit after merge."; exit 0; }
            git commit -m "Update price data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          done
          echo "::error::push still failing after 5 attempts"
          exit 1
